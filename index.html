<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면 꽉 채우기 및 배율 고정 뷰포트 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <!-- PWA 매니페스트 및 테마 색상 연결 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" id="themeColor" content="#0f172a">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <title>SI · US 단위 변환</title>
    <script>
        try {
            if (localStorage.getItem('eng_unit_theme_v1') === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeColor').setAttribute('content', '#f5f5f7');
            }
        } catch (e) {}
    </script>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1c1c1e;
            --muted: #6e6e73;
            --faint: #8e8e93;
            --fill: #ececf1;
            --line: #e4e4e9;
            --blue: #2563eb;
            --blue-soft: rgba(37, 99, 235, 0.1);
            --us: #b45309;
            --amber: #d97706;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }
        html.dark {
            color-scheme: dark;
            --bg: #000000;
            --card: #1c1c1e;
            --text: #f5f5f7;
            --muted: #a1a1aa;
            --faint: #8e8e93;
            --fill: #2c2c2e;
            --line: #2c2c2e;
            --blue: #60a5fa;
            --blue-soft: rgba(96, 165, 250, 0.14);
            --us: #fbbf24;
            --amber: #fbbf24;
            --shadow: none;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            text-size-adjust: 100%;
        }
        body {
            display: flex;
            justify-content: center;
            overscroll-behavior: none;
        }
        button, input, select { font: inherit; color: inherit; }
        button { cursor: pointer; }
        button:active { transform: scale(0.97); }
        button:focus-visible, select:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 2px;
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        .app {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: var(--bg);
        }
        @media (min-width: 760px) {
            body { align-items: center; background: #e7e7ec; }
            html.dark body { background: #0a0a0a; }
            .app {
                height: min(900px, calc(100dvh - 40px));
                border-radius: 24px;
                border: 1px solid rgba(0, 0, 0, 0.06);
                box-shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
            }
            html.dark .app { border-color: #222; box-shadow: none; }
        }

        .topbar {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: calc(8px + env(safe-area-inset-top)) 12px 8px 16px;
        }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand-mark {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: -0.04em;
            flex: none;
        }
        h1 {
            margin: 0;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.03em;
        }
        .top-actions { display: flex; align-items: center; }

        .main {
            flex: 1;
            min-height: 0;
            overflow: auto;
            overscroll-behavior: contain;
            scrollbar-width: none;
            padding: 4px 16px 28px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .main > * { flex-shrink: 0; }
        .main::-webkit-scrollbar { display: none; }
        .app.drawer-open .main { overflow: hidden; }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .ico { width: 20px; height: 20px; display: block; }
        .ico-sm { width: 18px; height: 18px; display: block; }

        .icon-hit, .ghost-btn, .swap-btn {
            border: 0;
            display: grid;
            place-items: center;
            background: transparent;
            color: var(--text);
        }
        .icon-hit {
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            color: var(--muted);
        }
        .badge {
            position: absolute;
            top: 2px;
            right: 0;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 99px;
            background: #2563eb;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            display: grid;
            place-items: center;
        }
        .badge[hidden] { display: none !important; }

        .cat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .cat-btn {
            min-height: 62px;
            border: 0;
            border-radius: 14px;
            background: transparent;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: -0.03em;
        }
        .cat-btn[data-active="true"] {
            background: var(--card);
            color: var(--blue);
            box-shadow: var(--shadow), 0 0 0 1px var(--line);
        }

        .preset-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            min-height: 34px;
        }
        .preset-row::-webkit-scrollbar { display: none; }
        .preset-btn {
            flex: none;
            height: 34px;
            padding: 0 12px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            font-weight: 650;
            font-variant-numeric: tabular-nums;
        }
        .preset-btn[data-active="true"] {
            background: var(--blue-soft);
            color: var(--blue);
        }

        .converter { display: flex; flex-direction: column; gap: 8px; }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 12px 14px 12px;
            box-shadow: var(--shadow);
        }
        .card[data-active="true"] { border-color: var(--blue); }
        .card-top, .formula-top, .panel-head, .sheet-head, .saved-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .card-kicker { display: flex; align-items: center; gap: 8px; min-height: 22px; }
        .sys {
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 0.06em;
        }
        .sys.si { color: var(--blue); }
        .sys.us { color: var(--us); }
        .role { font-size: 12px; font-weight: 650; color: var(--blue); }
        .role:empty { display: none; }
        .card-actions { display: flex; align-items: center; margin-right: -6px; }
        .text-btn {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            font-weight: 650;
            padding: 6px 8px;
            border-radius: 8px;
        }
        .num-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-top: 2px;
        }
        .num-input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: none;
            background: transparent;
            padding: 0;
            font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
            font-size: clamp(28px, 9vw, 36px);
            font-weight: 620;
            letter-spacing: -0.045em;
            font-variant-numeric: tabular-nums;
            line-height: 1.15;
            color: var(--text);
        }
        .num-input.is-result { color: var(--blue); }
        .num-input::placeholder { color: var(--faint); }
        .num-unit {
            flex: none;
            max-width: 46%;
            text-align: right;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--faint);
            line-height: 1.25;
        }
        .unit-select {
            width: 100%;
            margin-top: 10px;
            height: 44px;
            border: 0;
            border-radius: 12px;
            background-color: var(--fill);
            color: var(--text);
            font-size: 16px;
            font-weight: 620;
            letter-spacing: -0.02em;
            padding: 0 36px 0 12px;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%238e8e93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 6l4 4 4-4'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
        }

        .swap-row { display: flex; justify-content: center; gap: 8px; }
        .swap-btn, .ghost-btn { width: 44px; height: 44px; border-radius: 999px; }
        .swap-btn { background: #2563eb; color: #fff; }
        .ghost-btn { background: var(--card); color: var(--muted); border: 1px solid var(--line); }
        .ghost-btn[aria-pressed="true"] {
            color: var(--amber);
            background: rgba(217, 119, 6, 0.12);
            border-color: transparent;
        }
        .ghost-btn[aria-pressed="true"] svg { fill: currentColor; }
        #swapIcon { transition: transform 0.25s ease; }

        .tools { display: flex; flex-direction: column; gap: 10px; padding: 0 2px; }
        .formula-top { align-items: flex-start; }
        #formulaText, #reverseFormulaText {
            margin: 0;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 12.5px;
            font-weight: 620;
            letter-spacing: -0.02em;
            word-break: break-all;
        }
        #reverseFormulaText { margin-top: 3px; color: var(--muted); font-weight: 500; }
        .seg {
            display: flex;
            gap: 3px;
            padding: 3px;
            background: var(--fill);
            border-radius: 12px;
        }
        .prec-btn, .filter-btn {
            flex: 1;
            height: 32px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            font-weight: 680;
            white-space: nowrap;
        }
        .prec-btn[aria-pressed="true"],
        .filter-btn[aria-pressed="true"] {
            background: var(--card);
            color: var(--blue);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .panel-head { padding: 14px 14px 8px; align-items: baseline; }
        .panel-head h2 { margin: 0; font-size: 13px; font-weight: 720; letter-spacing: -0.02em; }
        #overviewBaseLabel {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 12px;
            font-weight: 650;
            color: var(--blue);
            text-align: right;
        }
        .filters { margin: 0 14px 8px; }
        .unit-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 2px 8px 2px 14px;
            border-top: 1px solid var(--line);
        }
        .unit-row.is-current { background: var(--blue-soft); }
        .unit-main {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 0;
            background: transparent;
            text-align: left;
            padding: 10px 0;
        }
        .unit-name { min-width: 0; display: flex; flex-direction: column; }
        .unit-name b {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 14px;
            font-weight: 700;
        }
        .unit-name small {
            color: var(--faint);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .unit-val {
            flex: none;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 15px;
            font-weight: 680;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.03em;
        }
        .empty { margin: 0; padding: 18px 14px 20px; color: var(--faint); font-size: 13px; }

        .tip { margin: 0; padding: 0 4px; font-size: 12px; line-height: 1.55; color: var(--faint); }
        .tip strong { display: block; margin-bottom: 2px; color: var(--muted); font-size: 12px; font-weight: 700; }

        .dock {
            flex: none;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--line);
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(16px);
        }
        .dock button {
            height: 42px;
            border: 0;
            border-radius: 12px;
            background: var(--fill);
            color: var(--text);
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 13px;
            font-weight: 680;
        }
        .dock button.op { color: var(--blue); }

        #savedDrawer {
            position: absolute;
            inset: 0;
            z-index: 30;
            background: rgba(0, 0, 0, 0.46);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        #savedDrawer[hidden] { display: none !important; }
        .sheet {
            background: var(--bg);
            border-radius: 20px 20px 0 0;
            max-height: 82%;
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .grabber {
            width: 36px;
            height: 4px;
            border-radius: 99px;
            background: var(--line);
            margin: 8px auto 0;
        }
        .sheet-head { padding: 12px 8px 12px 18px; }
        .sheet-head h2 { margin: 0; font-size: 16px; font-weight: 730; }
        .sheet-body { overflow: auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 18px; }
        .sheet-body h3 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
        }
        .block-head { display: flex; align-items: center; justify-content: space-between; }
        .saved-list { display: flex; flex-direction: column; gap: 8px; }
        .saved-item {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 4px 4px 4px 12px;
        }
        .saved-main {
            flex: 1;
            min-width: 0;
            border: 0;
            background: transparent;
            text-align: left;
            padding: 8px 0;
            font-size: 13px;
            font-weight: 650;
            letter-spacing: -0.02em;
        }
        .saved-copy { font-size: 13px; line-height: 1.45; padding: 8px 0; min-width: 0; }
        .saved-copy .tag { color: var(--blue); font-size: 11px; font-weight: 700; margin-right: 4px; }
        .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 700; }

        #toast {
            position: absolute;
            left: 50%;
            bottom: calc(64px + env(safe-area-inset-bottom));
            transform: translate(-50%, 6px);
            max-width: calc(100% - 32px);
            padding: 10px 14px;
            border-radius: 999px;
            background: var(--text);
            color: var(--bg);
            font-size: 13px;
            font-weight: 650;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
    <!-- 스마트폰 화면에서 바깥 여백과 가상 테두리를 없애고 100% 꽉 채우기 -->
    <style>
      @media (max-width: 768px) {
        html, body {
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          height: 100% !important;
          overflow-x: hidden !important;
        }
        body > div, #app, main, .app-container, .phone-frame {
          max-width: 100% !important;
          width: 100% !important;
          min-height: 100dvh !important;
          margin: 0 !important;
          border-radius: 0 !important;
          border: none !important;
          box-shadow: none !important;
        }
      }
    </style>
</head>
<body>
    <div class="app" id="app">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">SI</span>
                <h1>단위 변환</h1>
            </div>
            <div class="top-actions">
                <button type="button" id="btnOpenSaved" class="icon-hit" onclick="toggleSavedDrawer()" aria-label="즐겨찾기와 기록">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-3.5L6 20V5a1 1 0 0 1 1-1z"/></svg>
                    <span id="favCountBadge" class="badge" hidden>0</span>
                </button>
                <button type="button" id="btnThemeToggle" class="icon-hit" onclick="toggleTheme()" aria-label="화면 테마 변경">
                    <span id="themeIcon"></span>
                </button>
            </div>
        </header>

        <main class="main">
            <nav id="categoryGrid" class="cat-grid" aria-label="단위 종류"></nav>

            <h2 class="sr-only">자주 쓰는 변환</h2>
            <div id="presetContainer" class="preset-row"></div>

            <section class="converter" aria-label="양방향 변환">
                <article id="topCard" class="card" data-active="true">
                    <div class="card-top">
                        <div class="card-kicker">
                            <span id="topSysBadge" class="sys si">SI</span>
                            <span id="topRole" class="role"></span>
                        </div>
                        <div class="card-actions">
                            <button type="button" class="text-btn" onclick="clearInputs()">초기화</button>
                            <button type="button" class="icon-hit" onclick="copyValue('top')" aria-label="위 값 복사">
                                <svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="num-row">
                        <input id="inputTop" class="num-input" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="0" value="1" oninput="handleInput('top', this.value)" onfocus="setActiveInput('top')" aria-label="기준 값">
                        <span id="topSymbol" class="num-unit">mm</span>
                    </div>
                    <select id="selectTop" class="unit-select" onchange="handleUnitChange('top')" aria-label="위쪽 단위"></select>
                </article>

                <div class="swap-row">
                    <button type="button" class="swap-btn" onclick="swapUnits()" aria-label="위아래 단위 바꾸기">
                        <svg id="swapIcon" class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16"/><path d="M7 4 3.5 7.5M7 4l3.5 3.5"/><path d="M17 20V4"/><path d="M17 20l-3.5-3.5M17 20l3.5-3.5"/></svg>
                    </button>
                    <button type="button" id="btnPinPair" class="ghost-btn" onclick="toggleFavoritePair()" aria-label="이 조합 즐겨찾기" aria-pressed="false">
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.4 14.4 8.6l5.6.7-4.2 3.9 1.1 5.5L12 15.9 7 18.7l1.1-5.5L4 9.3l5.6-.7L12 3.4z"/></svg>
                    </button>
                </div>

                <article id="bottomCard" class="card" data-active="false">
                    <div class="card-top">
                        <div class="card-kicker">
                            <span id="bottomSysBadge" class="sys us">US</span>
                            <span id="bottomRole" class="role">결과</span>
                        </div>
                        <div class="card-actions">
                            <button type="button" class="text-btn" onclick="saveCurrentRecord()">기록</button>
                            <button type="button" class="icon-hit" onclick="copyValue('bottom')" aria-label="아래 값 복사">
                                <svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="num-row">
                        <input id="inputBottom" class="num-input is-result" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="0" oninput="handleInput('bottom', this.value)" onfocus="setActiveInput('bottom')" aria-label="변환 값">
                        <span id="bottomSymbol" class="num-unit">in</span>
                    </div>

            return String(value).replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function loadStorage() {
            try {
                const savedFavs = localStorage.getItem('eng_unit_favs_v1');
                state.favorites = savedFavs ? JSON.parse(savedFavs) : [
                    { categoryId: 'pressure', from: 'MPa', to: 'ksi', label: '압력 · MPa ↔ ksi' },
                    { categoryId: 'length', from: 'mm', to: 'in', label: '길이 · mm ↔ in' },

                    { categoryId: 'energy', from: 'J', to: 'ftlbf', label: '에너지 · J ↔ ft·lbf' }
                ];
                const savedHist = localStorage.getItem('eng_unit_hist_v1');
                if (savedHist) state.history = JSON.parse(savedHist);

                const session = JSON.parse(localStorage.getItem('eng_unit_session_v1') || 'null');
                if (session) {
                    const cat = UNIT_CATEGORIES.find((item) => item.id === session.categoryId);
                    const unitsOk = cat && cat.units.some((unit) => unit.id === session.unitTop) && cat.units.some((unit) => unit.id === session.unitBottom);
                    if (unitsOk) {
                        state.categoryId = session.categoryId;
                        state.unitTop = session.unitTop;
                        state.unitBottom = session.unitBottom;
                    }
                    if (['auto', 'sci', 2, 4].includes(session.precision)) state.precision = session.precision;
                    if (['all', 'SI', 'US'].includes(session.overviewFilter)) state.overviewFilter = session.overviewFilter;
                }
            } catch (e) {}
            updateFavBadge();
        }

        function saveStorage() {
            try {
                localStorage.setItem('eng_unit_favs_v1', JSON.stringify(state.favorites));
                localStorage.setItem('eng_unit_hist_v1', JSON.stringify(state.history));
                localStorage.setItem('eng_unit_session_v1', JSON.stringify({
                    categoryId: state.categoryId,
                    unitTop: state.unitTop,
                    unitBottom: state.unitBottom,
                    precision: state.precision,
                    overviewFilter: state.overviewFilter

            } catch (e) {}
            updateFavBadge();
        }

            return cat.units.find((unit) => unit.id === unitId) || cat.units[0];
        }

        function convertValue(value, fromUnitId, toUnitId, category = getCurrentCategory()) {
            const num = parseFloat(value);
            if (isNaN(num)) return NaN;
            if (fromUnitId === toUnitId) return num;
            const fromUnit = getUnitObj(category, fromUnitId);
            const toUnit = getUnitObj(category, toUnitId);
            if (category.isNonLinear) return toUnit.fromBase(fromUnit.toBase(num));
            return (num * fromUnit.factor) / toUnit.factor;
        }

        function formatNumber(num, mode = state.precision, forInput = false) {
            if (num === null || num === undefined || isNaN(num)) return '';
            if (num === 0) return '0';
            const abs = Math.abs(num);
            if (mode === 'sci') return num.toExponential(4);
            if (typeof mode === 'number') {
                const fixed = num.toFixed(mode);
                return forInput ? fixed : Number(fixed).toLocaleString('en-US', {
                    minimumFractionDigits: mode,
                    maximumFractionDigits: mode
                });
            }
            if (abs >= 1e7 || (abs > 0 && abs < 1e-5)) return num.toExponential(4);
            let decimals = 4;
            if (abs >= 1000) decimals = 2;
            else if (abs >= 10) decimals = 3;
            else if (abs >= 1) decimals = 4;
            else if (abs >= 0.01) decimals = 5;
            else decimals = 6;
            const cleanNum = Number(num.toFixed(decimals));
            if (forInput) return String(cleanNum);
            return cleanNum.toLocaleString('en-US', { maximumFractionDigits: decimals });
        }

        function renderCategories() {
            document.getElementById('categoryGrid').innerHTML = UNIT_CATEGORIES.map((cat) => `
                <button type="button" class="cat-btn" data-active="${cat.id === state.categoryId}" onclick="selectCategory('${cat.id}')">
                    ${SVG_OPEN}${cat.icon}</svg>
                    <span>${cat.name}</span>
                </button>
            `).join('');
        }

        function renderPresets() {
            const cat = getCurrentCategory();
            document.getElementById('presetContainer').innerHTML = cat.presets.map((preset) => {
                const selected = (state.unitTop === preset.from && state.unitBottom === preset.to) ||
                    (state.unitTop === preset.to && state.unitBottom === preset.from);
                return `<button type="button" class="preset-btn" data-active="${selected}" onclick="applyPreset('${preset.from}', '${preset.to}')">${esc(preset.label)}</button>`;
            }).join('');
        }

        function renderUnitSelects() {
            const cat = getCurrentCategory();
            const buildOptions = (selectedId) => ['SI', 'US'].map((sys) => {
                const options = cat.units.filter((unit) => unit.sys === sys).map((unit) =>
                    `<option value="${unit.id}" ${unit.id === selectedId ? 'selected' : ''}>${esc(unit.symbol)}  ${esc(unit.name)}</option>`
                ).join('');
                return `<optgroup label="${sys}">${options}</optgroup>`;
            }).join('');
            document.getElementById('selectTop').innerHTML = buildOptions(state.unitTop);
            document.getElementById('selectBottom').innerHTML = buildOptions(state.unitBottom);
            updateSystemBadges();
            updatePinButtonState();
        }

        function updateSystemBadges() {
            const cat = getCurrentCategory();
            const apply = (badgeId, symbolId, sys, symbol) => {
                const badge = document.getElementById(badgeId);
                badge.textContent = sys;
                badge.className = sys === 'SI' ? 'sys si' : 'sys us';
                document.getElementById(symbolId).textContent = symbol;
            };
            apply('topSysBadge', 'topSymbol', getUnitObj(cat, state.unitTop).sys, getUnitObj(cat, state.unitTop).symbol);
            apply('bottomSysBadge', 'bottomSymbol', getUnitObj(cat, state.unitBottom).sys, getUnitObj(cat, state.unitBottom).symbol);
        }

        function updateInputRoles() {
            const topActive = state.activeSide === 'top';
            document.getElementById('topCard').dataset.active = String(topActive);
            document.getElementById('bottomCard').dataset.active = String(!topActive);
            document.getElementById('inputTop').classList.toggle('is-result', !topActive);
            document.getElementById('inputBottom').classList.toggle('is-result', topActive);
            document.getElementById('topRole').textContent = topActive ? '' : '결과';
            document.getElementById('bottomRole').textContent = topActive ? '결과' : '';
        }

        function recalculate() {
            const cat = getCurrentCategory();
            const sourceIsTop = state.activeSide === 'top';
            const sourceRaw = (sourceIsTop ? state.rawValueTop : state.rawValueBottom).replace(/,/g, '');
            const targetInput = document.getElementById(sourceIsTop ? 'inputBottom' : 'inputTop');
            const num = parseFloat(sourceRaw);
            if (sourceRaw === '' || sourceRaw === '-' || isNaN(num)) {
                targetInput.value = '';
                if (sourceIsTop) state.rawValueBottom = '';
                else state.rawValueTop = '';
            } else {
                const converted = convertValue(
                    num,
                    sourceIsTop ? state.unitTop : state.unitBottom,
                    sourceIsTop ? state.unitBottom : state.unitTop,
                    cat
                );
                const raw = formatNumber(converted, state.precision, true);
                if (sourceIsTop) state.rawValueBottom = raw;
                else state.rawValueTop = raw;
                targetInput.value = formatNumber(converted, state.precision, false);
            }
            updateInputRoles();
            updateFormulaBar();
            renderAllUnitsOverview();
            renderPresets();
            updateTipSection();
        }

        function updateFormulaBar() {
            const cat = getCurrentCategory();
            const top = getUnitObj(cat, state.unitTop);
            const bottom = getUnitObj(cat, state.unitBottom);
            if (cat.isNonLinear) {
                document.getElementById('formulaText').textContent =
                    `0 ${top.symbol} = ${formatNumber(convertValue(0, state.unitTop, state.unitBottom, cat), 'auto')} ${bottom.symbol}`;
                document.getElementById('reverseFormulaText').textContent =
                    `100 ${top.symbol} = ${formatNumber(convertValue(100, state.unitTop, state.unitBottom, cat), 'auto')} ${bottom.symbol}`;
                return;
            }
            document.getElementById('formulaText').textContent =
                `1 ${top.symbol} = ${formatNumber(convertValue(1, state.unitTop, state.unitBottom, cat), 'auto')} ${bottom.symbol}`;
            document.getElementById('reverseFormulaText').textContent =
                `1 ${bottom.symbol} = ${formatNumber(convertValue(1, state.unitBottom, state.unitTop, cat), 'auto')} ${top.symbol}`;
        }

        function renderAllUnitsOverview() {
            const cat = getCurrentCategory();
            const baseUnitId = state.activeSide === 'top' ? state.unitTop : state.unitBottom;
            const raw = (state.activeSide === 'top' ? state.rawValueTop : state.rawValueBottom).replace(/,/g, '');
            const parsed = parseFloat(raw);
            const baseVal = isNaN(parsed) ? 1 : parsed;
            const baseUnit = getUnitObj(cat, baseUnitId);
            document.getElementById('overviewBaseLabel').textContent = `${formatNumber(baseVal, 'auto')} ${baseUnit.symbol}`;

            const units = cat.units.filter((unit) => state.overviewFilter === 'all' || unit.sys === state.overviewFilter);
            const list = document.getElementById('allUnitsList');
            if (!units.length) {
                list.innerHTML = '<p class="empty">표시할 단위가 없습니다.</p>';
                return;
            }
            list.innerHTML = units.map((unit) => {
                const formatted = formatNumber(convertValue(baseVal, baseUnitId, unit.id, cat), state.precision, false);
                const current = unit.id === state.unitTop || unit.id === state.unitBottom;
                return `
                    <div class="unit-row ${current ? 'is-current' : ''}">
                        <button type="button" class="unit-main" onclick="selectUnitFromOverview('${unit.id}')">
                            <span class="sys ${unit.sys === 'SI' ? 'si' : 'us'}">${unit.sys}</span>
                            <span class="unit-name"><b>${esc(unit.symbol)}</b><small>${esc(unit.name)}</small></span>
                        </button>
                        <span class="unit-val">${esc(formatted)}</span>
                        <button type="button" class="icon-hit" data-copy="${esc(formatted)} ${esc(unit.symbol)}" aria-label="${esc(unit.symbol)} 값 복사">${ICON_COPY}</button>
                    </div>
                `;
            }).join('');
        }

        function updateTipSection() {
            const cat = getCurrentCategory();
            document.getElementById('tipTitle').textContent = cat.tipTitle;
            document.getElementById('tipContent').textContent = cat.tipContent;
        }

        function selectCategory(catId) {
            state.categoryId = catId;
            const cat = getCurrentCategory();
            state.unitTop = cat.presets?.[0]?.from || cat.units[0].id;
            state.unitBottom = cat.presets?.[0]?.to || cat.units[1]?.id || cat.units[0].id;
            state.activeSide = 'top';
            if (!state.rawValueTop || isNaN(parseFloat(state.rawValueTop))) {
                state.rawValueTop = '1';
                document.getElementById('inputTop').value = '1';
            }
            renderCategories();
            renderUnitSelects();
            recalculate();
            saveStorage();
        }

        function applyPreset(fromId, toId) {
            if (state.unitTop === fromId && state.unitBottom === toId) {
                swapUnits();
                return;
            }
            state.unitTop = fromId;
            state.unitBottom = toId;
            state.activeSide = 'top';
            renderUnitSelects();
            recalculate();
            saveStorage();
        }

        function handleInput(side, value) {
            const sanitized = value.replace(/[^0-9.\-eE]/g, '');
            state.activeSide = side;
            if (side === 'top') state.rawValueTop = sanitized;
            else state.rawValueBottom = sanitized;
            recalculate();
        }

        function setActiveInput(side) {
            const changed = state.activeSide !== side;
            state.activeSide = side;
            updateInputRoles();
            if (changed) renderAllUnitsOverview();
        }

        function handleUnitChange(side) {
            state[side === 'top' ? 'unitTop' : 'unitBottom'] = document.getElementById(side === 'top' ? 'selectTop' : 'selectBottom').value;
            updateSystemBadges();
            updatePinButtonState();
            recalculate();
            saveStorage();
        }

        function swapUnits() {
            swapRotation += 180;
            document.getElementById('swapIcon').style.transform = `rotate(${swapRotation}deg)`;
            const previous = state.unitTop;
            state.unitTop = state.unitBottom;
            state.unitBottom = previous;
            state.activeSide = 'top';
            renderUnitSelects();
            recalculate();
            saveStorage();
        }

        function clearInputs() {
            state.rawValueTop = '';
            state.rawValueBottom = '';
            state.activeSide = 'top';
            document.getElementById('inputTop').value = '';
            document.getElementById('inputBottom').value = '';
            recalculate();
            document.getElementById('inputTop').focus();
        }

        function applyQuickValue(val) {
            const text = String(val);
            const input = document.getElementById(state.activeSide === 'top' ? 'inputTop' : 'inputBottom');
            if (state.activeSide === 'top') state.rawValueTop = text;
            else state.rawValueBottom = text;
            input.value = text;
            recalculate();
        }

        function multiplyActive(factor) {
            const raw = state.activeSide === 'top' ? state.rawValueTop : state.rawValueBottom;
            const current = parseFloat(String(raw).replace(/,/g, ''));
            const base = isNaN(current) ? 1 : current;
            applyQuickValue(Number((base * factor).toPrecision(12)));
        }

        function toggleSign() {
            const raw = (state.activeSide === 'top' ? state.rawValueTop : state.rawValueBottom).replace(/,/g, '');
            if (raw === '' || raw === '-') {
                applyQuickValue(raw === '-' ? '' : '-');
                return;
            }
            const num = parseFloat(raw);
            if (isNaN(num) || num === 0) return;
            applyQuickValue(Number((-num).toPrecision(12)));
        }

        function setPressed(selector, attr, value) {
            document.querySelectorAll(selector).forEach((button) => {
                button.setAttribute('aria-pressed', button.dataset[attr] === String(value) ? 'true' : 'false');
            });
        }

        function setPrecision(mode) {
            state.precision = mode;
            setPressed('.prec-btn', 'mode', mode);
            recalculate();
            saveStorage();
        }

        function setOverviewFilter(filter) {
            state.overviewFilter = filter;
            setPressed('.filter-btn', 'filter', filter);
            renderAllUnitsOverview();
            saveStorage();
        }

        function selectUnitFromOverview(unitId) {
            state.unitBottom = unitId;
            state.activeSide = 'top';
            renderUnitSelects();
            recalculate();
            saveStorage();
            showToast('결과 단위를 바꿨습니다');
        }

        function copyToClipboard(text, message) {
            const done = () => showToast(message || '복사했습니다');
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
                return;
            }
            fallbackCopy(text, done);
        }

        function fallbackCopy(text, done) {
            const area = document.createElement('textarea');
            area.value = text;
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            try {
                document.execCommand('copy');
                done();
            } catch (e) {
                showToast('복사하지 못했습니다');
            }
            area.remove();
        }

        function copyValue(side) {
            const cat = getCurrentCategory();
            const value = document.getElementById(side === 'top' ? 'inputTop' : 'inputBottom').value;
            const unit = getUnitObj(cat, side === 'top' ? state.unitTop : state.unitBottom);
            if (!value) {
                showToast('복사할 값이 없습니다');
                return;
            }
            copyToClipboard(`${value} ${unit.symbol}`, `${value} ${unit.symbol}`);
        }

        function copyFormula() {
            const text = document.getElementById('formulaText').textContent;
            copyToClipboard(text, text);
        }

        function isCurrentPairFavorited() {
            return state.favorites.some((fav) => fav.categoryId === state.categoryId && fav.from === state.unitTop && fav.to === state.unitBottom);
        }

        function updatePinButtonState() {
            document.getElementById('btnPinPair').setAttribute('aria-pressed', isCurrentPairFavorited() ? 'true' : 'false');
        }

        function toggleFavoritePair() {
            const cat = getCurrentCategory();
            const top = getUnitObj(cat, state.unitTop);
            const bottom = getUnitObj(cat, state.unitBottom);
            const index = state.favorites.findIndex((fav) => fav.categoryId === state.categoryId && fav.from === state.unitTop && fav.to === state.unitBottom);
            if (index >= 0) {
                state.favorites.splice(index, 1);
                showToast('즐겨찾기에서 뺐습니다');
            } else {
                state.favorites.unshift({
                    categoryId: state.categoryId,
                    from: state.unitTop,
                    to: state.unitBottom,
                    label: `${cat.name} · ${top.symbol} ↔ ${bottom.symbol}`
                });
                showToast('즐겨찾기에 넣었습니다');
            }
            saveStorage();
            updatePinButtonState();
            renderSavedDrawerLists();
        }

        function saveCurrentRecord() {
            const cat = getCurrentCategory();
            const top = getUnitObj(cat, state.unitTop);
            const bottom = getUnitObj(cat, state.unitBottom);
            state.history.unshift({
                categoryId: state.categoryId,
                categoryName: cat.name,
                fromId: state.unitTop,
                toId: state.unitBottom,
                valA: document.getElementById('inputTop').value || '0',
                symA: top.symbol,
                valB: document.getElementById('inputBottom').value || '0',
                symB: bottom.symbol
            });
            if (state.history.length > 20) state.history.pop();
            saveStorage();
            renderSavedDrawerLists();
            showToast('기록에 저장했습니다');
        }

        function updateFavBadge() {
            const badge = document.getElementById('favCountBadge');
            if (!badge) return;
            badge.hidden = state.favorites.length === 0;
            badge.textContent = state.favorites.length;
        }

        function toggleSavedDrawer() {
            const drawer = document.getElementById('savedDrawer');
            const willOpen = drawer.hidden;
            if (willOpen) renderSavedDrawerLists();
            drawer.hidden = !willOpen;
            document.getElementById('app').classList.toggle('drawer-open', willOpen);
        }

        function onDrawerBackdrop(event) {
            if (event.target.id === 'savedDrawer') toggleSavedDrawer();
        }

        function renderSavedDrawerLists() {
            const favList = document.getElementById('favPairsList');
            const histList = document.getElementById('historyList');
            favList.innerHTML = state.favorites.length ? state.favorites.map((fav, index) => `
                <div class="saved-item">
                    <button type="button" class="saved-main" data-load="${index}">${esc(fav.label)}</button>
                    <button type="button" class="icon-hit" data-remove="${index}" aria-label="즐겨찾기 삭제">${ICON_TRASH}</button>
                </div>
            `).join('') : '<p class="empty">별표를 누르면 이 조합이 여기 모입니다.</p>';

            histList.innerHTML = state.history.length ? state.history.map((item, index) => `
                <div class="saved-item">
                    <div class="saved-copy">
                        <span class="tag">${esc(item.categoryName)}</span>
                        <span class="mono">${esc(item.valA)} ${esc(item.symA)}</span>
                        <span style="color: var(--faint)"> = </span>
                        <span class="mono">${esc(item.valB)} ${esc(item.symB)}</span>
                    </div>
                    <button type="button" class="icon-hit" data-hist="${index}" aria-label="기록 복사">${ICON_COPY}</button>
                </div>
            `).join('') : '<p class="empty">결과 카드의 기록 버튼으로 남길 수 있습니다.</p>';
        }

        document.getElementById('favPairsList').addEventListener('click', (event) => {
            const load = event.target.closest('[data-load]');
            const remove = event.target.closest('[data-remove]');
            if (remove) {
                state.favorites.splice(Number(remove.dataset.remove), 1);
                saveStorage();
                updatePinButtonState();
                renderSavedDrawerLists();
                return;
            }
            if (!load) return;
            const fav = state.favorites[Number(load.dataset.load)];
            if (!fav) return;
            state.categoryId = fav.categoryId;
            state.unitTop = fav.from;
            state.unitBottom = fav.to;
            state.activeSide = 'top';
            renderCategories();
            renderUnitSelects();
            recalculate();
            saveStorage();
            toggleSavedDrawer();
        });

        document.getElementById('historyList').addEventListener('click', (event) => {
            const button = event.target.closest('[data-hist]');
            if (!button) return;
            const item = state.history[Number(button.dataset.hist)];
            if (!item) return;
            copyToClipboard(`${item.valA} ${item.symA} = ${item.valB} ${item.symB}`);
        });

        document.getElementById('allUnitsList').addEventListener('click', (event) => {
            const button = event.target.closest('[data-copy]');
            if (!button) return;
            event.stopPropagation();
            copyToClipboard(button.dataset.copy);
        });

        function clearHistory() {
            state.history = [];
            saveStorage();
            renderSavedDrawerLists();
            showToast('기록을 지웠습니다');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1700);
        }

        function applyThemeColor() {
            const dark = document.documentElement.classList.contains('dark');
            document.getElementById('themeColor').setAttribute('content', dark ? '#000000' : '#f5f5f7');
            document.getElementById('themeIcon').innerHTML = dark ? ICON_SUN : ICON_MOON;
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const dark = document.documentElement.classList.contains('dark');
            try { localStorage.setItem('eng_unit_theme_v1', dark ? 'dark' : 'light'); } catch (e) {}
            applyThemeColor();
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !document.getElementById('savedDrawer').hidden) toggleSavedDrawer();
        });

        function boot() {
            loadStorage();
            applyThemeColor();
            renderCategories();
            renderUnitSelects();
            setPressed('.filter-btn', 'filter', state.overviewFilter);
            setPrecision(state.precision);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
    </script>

    <!-- 서비스 워커(오프라인 지원) 등록 스크립트 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker 등록 성공:', reg.scope))
                    .catch(err => console.log('Service Worker 등록 실패:', err));
            });
        }
    </script>
</body>
</html>
